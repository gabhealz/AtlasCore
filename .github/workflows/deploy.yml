name: Deploy VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config >/dev/null

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      - name: Sync files to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='backend/.env' \
            --exclude='frontend/.env' \
            --exclude='node_modules/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/dist/' \
            --exclude='.agent/' \
            --exclude='.agents/' \
            --exclude='_bmad/' \
            --exclude='_bmad-output/' \
            --exclude='_reference/' \
            --exclude='test_uploads/' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Write production env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          # O .env da VPS foi montado na mao e tem tudo que o Atlas precisa pra
          # subir. Se o secret vier vazio, sobrescrever apagaria o arquivo
          # inteiro e derrubaria a aplicacao. Nesse caso e melhor manter o que
          # ja esta la e deixar o deploy seguir.
          if [ -z "$(printf '%s' "$PRODUCTION_ENV" | tr -d '[:space:]')" ]; then
            echo "PRODUCTION_ENV vazio. Mantendo o .env que ja existe na VPS."
            exit 0
          fi
          printf '%s\n' "$PRODUCTION_ENV" | ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && umask 077 && cat > .env"

      - name: Ensure CRM webhook secret
        env:
          CRM_WEBHOOK_SECRET: ${{ secrets.CRM_WEBHOOK_SECRET }}
        run: |
          # Integracao com o Vendly CRM: negocio ganho la vira cliente aqui.
          # Fica em secret proprio, e nao dentro do PRODUCTION_ENV, pra
          # sobreviver a qualquer reescrita do .env feita acima. O valor vai
          # por stdin pra nao aparecer na lista de processos da VPS.
          if [ -z "$CRM_WEBHOOK_SECRET" ]; then
            echo "CRM_WEBHOOK_SECRET nao configurado. Integracao com o CRM fica desligada."
            exit 0
          fi
          printf 'CRM_WEBHOOK_SECRET=%s\n' "$CRM_WEBHOOK_SECRET" | ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && umask 077 && sed -i '/^CRM_WEBHOOK_SECRET=/d' .env && cat >> .env"

      - name: Deploy containers
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"

      - name: Run migrations
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head"
